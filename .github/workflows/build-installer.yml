name: Build QuizScore Live installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-installer:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore Score.sln -PackagesDirectory packages

      - name: Build Release
        shell: pwsh
        run: msbuild Score.sln /t:Rebuild /p:Configuration=Release /p:Platform="Any CPU" /v:minimal

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: '& "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" installer\Score.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizScore-Live-installer
          path: installer-output/ScoreSetup.exe

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer-output/ScoreSetup.exe
          generate_release_notes: true
