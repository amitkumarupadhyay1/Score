name: Build QuizScore Live installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore Score.sln -PackagesDirectory packages -NonInteractive

      - name: Build Release
        shell: pwsh
        run: msbuild Score.sln /t:Rebuild /p:Configuration=Release /p:Platform="Any CPU" /warnaserror /v:minimal

      - name: Run production checks
        shell: pwsh
        run: '& .\Score.Tests\bin\Release\Score.Tests.exe'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          $rawVersion = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "1.0.$env:GITHUB_RUN_NUMBER" }
          $versionMatch = [regex]::Match($rawVersion, '^\d+\.\d+\.\d+(\.\d+)?')
          if (-not $versionMatch.Success) { throw "Tag '$rawVersion' does not begin with a numeric version such as 1.2.3." }
          $version = $versionMatch.Value
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer\Score.iss

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash installer-output\ScoreSetup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *ScoreSetup.exe" | Set-Content installer-output\ScoreSetup.exe.sha256 -Encoding ascii

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizScore-Live-installer
          path: |
            installer-output/ScoreSetup.exe
            installer-output/ScoreSetup.exe.sha256

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer-output/ScoreSetup.exe
            installer-output/ScoreSetup.exe.sha256
          generate_release_notes: true
